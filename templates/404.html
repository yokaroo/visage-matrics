<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Halaman Tidak Ditemukan</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        max-width: 520px;
        padding: 40px 30px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 28px 60px rgba(15, 23, 42, 0.12);
      }
      .code {
        font-size: 96px;
        font-weight: 900;
        margin: 0;
        color: #2563eb;
      }
      .message {
        font-size: 24px;
        margin: 16px 0 8px;
        font-weight: 700;
      }
      .description {
        color: #475569;
        margin-bottom: 28px;
        line-height: 1.8;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 30px;
        background: #2563eb;
        color: #ffffff;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .button:hover {
        transform: translateY(-2px);
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="code">404</p>
      <h1 class="message">Oops, halaman tidak ditemukan.</h1>
      <p class="description">
        Maaf, halaman yang Anda cari tidak ada atau sudah dipindahkan. Silakan
        kembali ke beranda untuk melanjutkan.
      </p>
      <a class="button" href="/">Kembali ke Beranda</a>
    </div>
  </body>
</html>
